name: PersonaSiriStudio
options:
  bundleIdPrefix: com.persona
  deploymentTarget:
    iOS: "17.0"
targets:
  PersonaSiriStudio:
    type: application
    platform: iOS
    sources:
      - PersonaSiriStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.persona.siripersonality
        PRODUCT_NAME: Persona
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_CFBundleDisplayName: Persona
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
