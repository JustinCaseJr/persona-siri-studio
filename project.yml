name: PersonaSiriStudio
options:
  bundleIdPrefix: com.persona
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  PersonaSiriStudio:
    type: application
    platform: iOS
    sources:
      - PersonaSiriStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.persona.siripersonality
        PRODUCT_NAME: Persona
        PRODUCT_MODULE_NAME: PersonaSiriStudio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Persona
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  PersonaSiriStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PersonaSiriStudioTests
    dependencies:
      - target: PersonaSiriStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.persona.siripersonality.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Persona.app/Persona"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PersonaSiriStudio:
    build:
      targets:
        PersonaSiriStudio: all
        PersonaSiriStudioTests: [test]
    test:
      config: Debug
      targets:
        - PersonaSiriStudioTests
