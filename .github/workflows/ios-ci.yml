name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: xcodebuild build -project PersonaSiriStudio.xcodeproj -scheme PersonaSiriStudio -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: xcodebuild test -project PersonaSiriStudio.xcodeproj -scheme PersonaSiriStudio -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO
